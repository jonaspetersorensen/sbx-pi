schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Pi Coding Agent with GitHub Copilot authentication

sandbox:
  image: "sbx-pi:latest"
#  entrypoint: [pi]

credentials:
  - service: copilot
    apiKey:
      name: COPILOT_GITHUB_TOKEN
      proxyManaged: true
      inject:
        - domain: api.individual.githubcopilot.com
          header: Authorization
          format: "Bearer %s"
        - domain: api.business.githubcopilot.com
          header: Authorization
          format: "Bearer %s"
        - domain: api.enterprise.githubcopilot.com
          header: Authorization
          format: "Bearer %s"
        - domain: api.githubcopilot.com
          header: Authorization
          format: "Bearer %s"
        - domain: copilot.github.com
          header: Authorization
          format: "Bearer %s"

permissions:
  network:
    allow:
      - "*"
      - "api.individual.githubcopilot.com"
      - "api.business.githubcopilot.com"
      - "api.enterprise.githubcopilot.com"
      - "api.githubcopilot.com"
      - "copilot.github.com"
      - "github.com"
      - "raw.githubusercontent.com"
      - "registry.npmjs.org"

